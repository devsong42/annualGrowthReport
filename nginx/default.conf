server {
    listen 80;
    server_name _;

    # 只压文本类静态资源；图片等本身已是压缩格式，压了白费 CPU
    gzip on;
    gzip_comp_level 2;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 连接空闲默认只保持 65 秒：手机端隔一会儿再点，首个请求会撞上刚关闭的连接
    # （前端有自动重试兜底，这里再放宽，减少这类"卡一下"）
    keepalive_timeout 300s;

    # 请求体上限与后端一致（图片 5MB / 音乐 8MB），超限的直接在这里挡掉，
    # 不必先完整上传再被应用层拒绝
    client_max_body_size 8m;
    error_page 413 = @too_large;
    location @too_large {
        default_type application/json;
        return 413 '{"error":"文件太大，超过 8MB 上限"}';
    }

    include /etc/nginx/conf.d/snippets/security-headers.conf;

    # 前端静态文件（挂载自宿主机 ./static）
    # 本项目没有客户端路由，所以不做 SPA 回退：找不到就老实回 404，
    # 免得把「路径写错 / 文件漏传」伪装成 200 的 HTML
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # 背景图目录：文件不存在时直接 404
    location /images/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public" always;
        include /etc/nginx/conf.d/snippets/security-headers.conf;
    }

    # 背景音乐目录，规则同上
    location /music/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public" always;
        include /etc/nginx/conf.d/snippets/security-headers.conf;
        # nginx 自带 mime.types 缺 wav，且 types 块是「替换」而非追加，所以这里把音频类型列全
        types {
            audio/mpeg mp3;
            audio/x-m4a m4a;
            audio/ogg ogg;
            audio/wav wav;
        }
    }

    # 管理面板入口：带不带尾斜杠都跳到具体文件
    # （不带的话 try_files 会回落到学员首页，管理员会以为面板坏了）
    location = /admin {
        return 301 /admin.html;
    }

    location = /admin/ {
        return 301 /admin.html;
    }

    location ~ ^/admin\.(html|js|css)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/snippets/security-headers.conf;
    }

    # 后端 API，转发到 compose 里的 app 服务
    location /api/ {
        # 响应小且含用户数据，压缩收益为零还要防压缩侧信道，直接不压
        gzip off;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 批量导入要逐行算 bcrypt，几百人时可能超过默认的 60 秒
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Let's Encrypt 域名验证目录（配 HTTPS 时 certbot 用，现在不影响运行）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
