server {
    listen 80;
    server_name _;

    # 只压文本类静态资源；图片等本身已是压缩格式，压了白费 CPU
    gzip on;
    gzip_comp_level 2;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 前端静态文件（挂载自宿主机的 ./static）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 背景图目录：文件不存在时直接 404，不要回落到 index.html
    location /images/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
    }

    # 背景音乐目录，规则同上
    location /music/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
        # nginx 自带 mime.types 缺 wav，且 types 块是「替换」而非追加，所以这里把音频类型列全
        types {
            audio/mpeg mp3;
            audio/x-m4a m4a;
            audio/ogg ogg;
            audio/wav wav;
        }
    }

    # 管理面板：入口重定向到具体文件（try_files 会把 /admin 回落到学员首页），面板文件不缓存
    location = /admin {
        return 302 /admin.html;
    }

    location ~ ^/admin\.(html|js|css)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # 后端 API，转发到 compose 里的 app 服务
    location /api/ {
        # 响应小且含用户数据，压缩收益为零还要防压缩侧信道，直接不压
        gzip off;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 批量导入要逐行算 bcrypt，几百人时可能超过默认的 60 秒
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 后续管理员上传 Excel 导入数据时需要
    client_max_body_size 10m;

    # Let's Encrypt 域名验证目录（配 HTTPS 时 certbot 用，现在不影响运行）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
