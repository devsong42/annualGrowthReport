# 安全响应头：集中一处，改一次到处生效
# （nginx 的规则：location 里一旦自己写了 add_header，就不再继承上层的，
#   所以每个自带 add_header 的 location 都要 include 一次这个文件）
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy same-origin always;
# 页面没有任何内联脚本，所以 script-src 只允许同源即可；样式允许内联是因为动画与主题色靠元素 style
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
