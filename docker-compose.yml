services:
  app:
    build:
      context: .
      # 容器默认 bridge 网络没有 IPv6 路由，而镜像源会返回 AAAA 记录导致 npm 卡住，构建期借用宿主机网络
      network: host
    image: annual-report-app:latest
    container_name: report-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /app/data/report.db
      SESSION_SECRET: ${SESSION_SECRET:?请在 .env 中设置 SESSION_SECRET}
    volumes:
      - sqlite_data:/app/data
      - ./import:/app/import
      # 静态资源目录：可写，因为管理面板要能上传图片与音乐；nginx 侧仍以只读挂载
      - ./static:/app/static
    networks:
      - report-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:stable-alpine
    container_name: report-nginx
    restart: unless-stopped
    ports:
      # 系统 nginx 占用 80 时先用 8080，停掉系统 nginx 后改成 80
      - "${HTTP_PORT:-80}:80"
      # 配好 HTTPS 后取消注释，并在 nginx/default.conf 中补充 443 server 块
      # - "443:443"
    volumes:
      # 挂载整个目录而不是单个文件：单文件 bind mount 在编辑文件后会读到旧 inode
      - ./nginx:/etc/nginx/conf.d:ro
      - ./static:/usr/share/nginx/html:ro
      # 配 HTTPS 时取消注释，certbot 证书目录与验证目录
      # - ./certbot/conf:/etc/letsencrypt:ro
      # - ./certbot/www:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - report-network

volumes:
  sqlite_data:

networks:
  report-network:
    driver: bridge
