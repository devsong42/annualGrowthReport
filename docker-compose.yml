services:
  app:
    build: .
    image: annual-report-app:latest
    container_name: report-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /app/data/report.db
      SESSION_SECRET: ${SESSION_SECRET:?请在 .env 中设置 SESSION_SECRET}
    volumes:
      - sqlite_data:/app/data
    networks:
      - report-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:stable-alpine
    container_name: report-nginx
    restart: unless-stopped
    ports:
      # 系统 nginx 占用 80 时先用 8080，停掉系统 nginx 后改成 80
      - "${HTTP_PORT:-80}:80"
      # 配好 HTTPS 后取消注释，并在 nginx/default.conf 中补充 443 server 块
      # - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/usr/share/nginx/html:ro
      # 配 HTTPS 时取消注释，certbot 证书目录与验证目录
      # - ./certbot/conf:/etc/letsencrypt:ro
      # - ./certbot/www:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - report-network

volumes:
  sqlite_data:

networks:
  report-network:
    driver: bridge
